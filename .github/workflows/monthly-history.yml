name: monthly-football-history

on:
  schedule:
    # 02:00 UTC on the first day of each month = 10:00 Hong Kong time.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_history.py --seasons 5
      - run: python scripts/build_complete.py
      - name: commit
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@bot.com"
          git add data/
          git commit -m "auto: monthly history update $(date +%Y-%m-%d)" || echo "no changes"
          git push
