name: daily-market-values

on:
  schedule:
    # 20:00 UTC = 04:00 Hong Kong time next day
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Fetch visible market values
        run: python scripts/enrich_market_values.py
      - name: Validate database
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect('football_complete.db')
          assert c.execute('pragma integrity_check').fetchone()[0] == 'ok'
          assert c.execute('select count(*) from fixtures').fetchone()[0] >= 65000
          print('fixtures=', c.execute('select count(*) from fixtures').fetchone()[0])
          print('team_values=', c.execute('select count(*) from team_values').fetchone()[0])
          c.close()
          PY
      - name: Commit updated values and report
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@bot.com"
          git add football_complete.db data/market_value_report.json
          git commit -m "auto: update visible market values $(date +%Y-%m-%d)" || echo "no changes"
          git push
