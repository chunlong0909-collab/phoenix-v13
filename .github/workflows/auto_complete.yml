name: auto-complete-football-data

on:
  workflow_dispatch:
  schedule:
    # 每3小時執行一次；GitHub cron 使用 UTC
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  crawl-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Build dynamic phase one catalog
        run: python scripts/master_football_catalog.py --phase1

      - name: Validate no fabricated HT values
        run: |
          python - <<'PY'
          import json, sqlite3
          r = json.load(open('catalog/report.json'))
          assert r['season'] == '2025-2026'
          assert r['totals']['teams'] >= 0
          print('dynamic teams=', r['totals']['teams'])
          print('complete teams=', r['totals']['complete_teams'])
          PY

      - name: Commit checkpoint and real data
        run: |
          git config user.name "phoenix-auto-bot"
          git config user.email "auto@phoenix-v13.invalid"
          git add catalog scripts/master_football_catalog.py .github/workflows/auto_complete.yml
          git commit -m "auto: dynamic teams players and explicit HT catalog $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push origin main
