name: auto-complete-football-data

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "批次編號；2=英冠/西甲/德甲/意甲/法甲各10隊"
        required: true
        default: "2"
  schedule:
    # 每3小時執行一次；GitHub cron 使用 UTC
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  crawl-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Build Plan B phase one catalog
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/plan_b_catalog.py --batch "${{ inputs.batch || '2' }}"

      - name: Validate Plan B produced real teams and explicit HT
        run: |
          python - <<'PY'
          import json, sqlite3
          r = json.load(open('catalog/report.json'))
          assert r['season'] == '2025-2026'
          assert r['source_policy'].startswith('football-data.org')
          assert r['totals']['teams'] == 50, r['totals']
          assert r['totals']['complete_teams'] == 50, r['totals']
          print('dynamic teams=', r['totals']['teams'])
          print('complete teams=', r['totals']['complete_teams'])
          PY

      - name: Package verified batch
        run: |
          BATCH="${{ inputs.batch || '2' }}"
          zip -qr "phoenix_TRUE_FINAL_v${BATCH}.zip" catalog

      - name: Commit checkpoint and real data
        run: |
          git config user.name "phoenix-auto-bot"
          git config user.email "auto@phoenix-v13.invalid"
          git add catalog "phoenix_TRUE_FINAL_v${{ inputs.batch || '2' }}.zip" scripts/plan_b_catalog.py .github/workflows/auto_complete.yml
          git commit -m "auto: Plan B football-data catalog with explicit HT $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push origin main
