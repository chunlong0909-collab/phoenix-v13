name: auto-complete-football-data

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "批次編號；3=巴甲10+英超10+意甲10+西甲13+德甲10+法甲10"
        required: true
        default: "3"
  schedule:
    # 每3小時執行一次；GitHub cron 使用 UTC
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  crawl-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Build Plan B real cross-season catalog
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/plan_b_catalog.py --batch "${{ inputs.batch || '3' }}" --mode real

      - name: Validate Plan B produced real teams and explicit HT
        run: |
          python - <<'PY'
          import json, sqlite3
          r = json.load(open('catalog/report.json'))
          assert r['season'] == '2025-2026 + 2024-2025'
          assert r['mode'] == 'real'
          assert r['source_policy'].startswith('football-data.org')
          assert r['totals']['complete_teams'] == 63, r['totals']
          assert r['totals']['teams'] == 63, r['totals']
          expected = {'巴甲': 10, '英超': 10, '意甲': 10, '西甲': 13, '德甲': 10, '法甲': 10}
          actual = {k: v['target_teams'] for k, v in r['leagues'].items()}
          assert actual == expected, actual
          assert r['totals']['incomplete_teams'] == r['totals']['teams'] - r['totals']['complete_teams']
          assert __import__('os').path.exists('catalog/fail_list.txt')
          assert __import__('os').path.exists('catalog/completed_teams.json')
          print('dynamic teams=', r['totals']['teams'])
          print('complete teams=', r['totals']['complete_teams'])
          print('incomplete teams=', r['totals']['incomplete_teams'])
          PY

      - name: Package verified batch
        run: |
          zip -qr phoenix_TRUE_FINAL_v2_plus23.zip catalog

      - name: Commit checkpoint and real data
        run: |
          git config user.name "phoenix-auto-bot"
          git config user.email "auto@phoenix-v13.invalid"
          git add catalog phoenix_TRUE_FINAL_v2_plus23.zip scripts/plan_b_catalog.py .github/workflows/auto_complete.yml
          git commit -m "day2: add 23 teams and fix league labels $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push origin main
