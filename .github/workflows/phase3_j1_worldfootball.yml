name: phoenix-tier1-j1-worldfootball

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  j1-worldfootball:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Collect J1 rounds 1-38 from WorldFootball HTML
        env:
          J1_WORLD_FOOTBALL_ONLY: "1"
        run: python scripts/phase3_j1_catalog.py --mode real

      - name: Strict real-data validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('catalog/complete_5_leagues_catalog.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          block=d.get('J1聯賽', {})
          teams=block.get('teams', [])
          rows=[]
          for t in teams:
              rows.extend(t.get('matches', []))
          unique={(m.get('match_id'),m.get('date'),m.get('home'),m.get('away'),m.get('ft_home'),m.get('ft_away')) for m in rows}
          print(f'WorldFootball teams={len(teams)} matches={len(unique)}')
          if len(teams) != 20:
              raise SystemExit(f'J1 validation failed: expected 20 teams, got {len(teams)}')
          if len(unique) != 380:
              raise SystemExit(f'J1 validation failed: expected exactly 380 real matches, got {len(unique)}')
          if any(m.get('source') != 'worldfootball.net' for m in rows):
              raise SystemExit('J1 validation failed: non-WorldFootball source detected')
          if any(m.get('ft_home') is None or m.get('ft_away') is None for m in rows):
              raise SystemExit('J1 validation failed: missing FT')
          if p.stat().st_size <= 100_000:
              raise SystemExit(f'J1 validation failed: file too small ({p.stat().st_size} bytes)')
          print(f'J1_WORLDFOOTBALL_VALIDATION_OK size={p.stat().st_size} bytes')
          PY
          ls -lh catalog/complete_5_leagues_catalog.json

      - name: Commit and rebase push
        run: |
          git config user.name "phoenix-auto-bot"
          git config user.email "auto@phoenix-v13.invalid"
          git add scripts/phase3_j1_catalog.py .github/workflows/phase3_j1_worldfootball.yml catalog/complete_5_leagues_catalog.json catalog/phoenix_FULL_ALL_98teams.json catalog/phase3_j1_report.json catalog/phase3_j1_fail_list.txt
          git commit -m "phase3 tier1: append real J1 WorldFootball rounds" || echo "no changes"
          git config pull.rebase true
          git pull origin main --rebase
          git push origin main
