name: validate-230

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/complete_5_leagues_catalog.json'
      - 'catalog/162_backtest_report.json'
      - 'scripts/backtest_162.py'
      - 'scripts/validate_162.py'
      - 'scripts/validate_backtest_162.py'
      - 'data/leagues/norway/matches.csv'
      - 'data/leagues/sweden/matches.csv'
      - 'data/leagues/denmark/matches.csv'

permissions:
  contents: read

jobs:
  validate-230:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 230-team catalog
        run: python scripts/validate_162.py
      - name: Validate Dixon-Coles backtest
        run: python scripts/validate_backtest_162.py
