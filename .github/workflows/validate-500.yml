name: validate-500

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/complete_500_partial_catalog.json'
      - 'catalog/expansion_444_to_487_report.json'
      - 'catalog/444_to_487_backtest_report.json'
      - 'scripts/complete_500_real.py'
      - 'scripts/backtest_500_partial.py'
      - 'scripts/validate_500_completion.py'
      - 'data/raw/secondary/**'

permissions:
  contents: read

jobs:
  catalog-validation:
    name: CATALOG GREEN SAFE actual FT catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate real FT and null HT policy
        run: python scripts/validate_500_completion.py

  backtest-validation:
    name: BACKTEST GREEN Dixon-Coles real FT
    needs: catalog-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-run reproducible backtest
        run: python scripts/backtest_500_partial.py
      - name: Validate generated report
        run: python scripts/validate_500_completion.py
