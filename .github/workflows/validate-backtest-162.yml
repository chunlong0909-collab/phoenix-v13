name: validate-backtest-162

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/complete_5_leagues_catalog.json'
      - 'catalog/162_backtest_report.json'
      - 'scripts/backtest_162.py'
      - 'scripts/validate_162.py'
      - 'scripts/validate_backtest_162.py'

permissions:
  contents: read

jobs:
  backtest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 162-team source catalog
        run: python scripts/validate_162.py
      - name: Validate reproducible backtest report
        run: python scripts/validate_backtest_162.py
