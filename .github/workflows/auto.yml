name: daily-football-update

on:
  schedule:
    # GitHub Actions uses UTC; 19:00 UTC = 03:00 next day Hong Kong time.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # 無 API Key：FBref/soccerdata 優先，失敗或不支援時使用既有公開後備來源。
      - run: python scripts/sync_free_sources.py --leagues all
      - run: python scripts/build_complete.py
      - name: commit
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@bot.com"
          git add data/ scripts/sync_free_sources.py requirements.txt
          git commit -m "auto: daily update $(date +%Y-%m-%d)" || echo "no changes"
          git push
