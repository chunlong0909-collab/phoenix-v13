name: daily-football-update

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 更新最新球員及球隊資料
        run: python espn_bulk_collect.py

      - name: 更新最新賽果資料
        run: python league_collector.py --leagues all --max-matches 60

      - name: 建立歷史與最新資料合併檔
        run: python scripts/build_complete.py

      - name: 儲存更新
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@bot.com"
          git add data/
          git commit -m "auto: daily football update $(date +%Y-%m-%d)" || echo "no changes"
          git push
