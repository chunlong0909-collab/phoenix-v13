name: daily-football-update

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 更新 ESPN 球隊及球員
        run: python espn_bulk_collect.py

      - name: 更新聯賽賽果
        run: python league_collector.py --leagues all --max-matches 60

      - name: 儲存更新資料
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@bot.com"
          git add data/
          git commit -m "auto: daily football data update $(date +%Y-%m-%d)" || echo "沒有新資料"
          git push
