name: validate-expansion-162

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/complete_5_leagues_catalog.json'
      - 'data/leagues/super_lig/**'
      - 'data/leagues/jupiler/**'
      - 'data/leagues/brasileirao/**'
      - 'scripts/validate_162.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 162-team catalog and source files
        run: python scripts/validate_162.py
