name: V71 Full World
on: {workflow_dispatch:}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - run: pip install soccerdata pandas lxml
      - run: python -c "import soccerdata as sd; fb=sd.FBref(leagues=['ENG-Premier League'], seasons=2024); df=fb.read_player_season_stats(); df.to_csv('players_world.csv', index=False)"
      - run: |
          git config --global user.name 'bot'
          git config --global user.email 'bot@bot.com'
          git add *.csv
          git commit -m 'world' || true
          git push
