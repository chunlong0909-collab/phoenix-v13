name: Weekly squad and coach refresh

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install refresh dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pandas lxml

      - name: Refresh Wikipedia squads
        run: python scripts/wikipedia_squad_updater.py

      - name: Refresh Wikipedia managers and coaches
        run: python scripts/enrich_coaches_for_436.py

      - name: Commit changed squad file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/final_574_squads_with_sources.json; then
            echo 'No squad or coach changes detected.'
            exit 0
          fi
          git add data/final_574_squads_with_sources.json
          git commit -m "chore: weekly squad+coach refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
