name: validate-367

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/complete_5_leagues_catalog.json'
      - 'catalog/expansion_367_report.json'
      - 'catalog/367_backtest_report.json'
      - 'scripts/validate_367.py'
      - 'scripts/validate_backtest_367.py'
      - 'data/raw/**'

permissions:
  contents: read

jobs:
  catalog-validation:
    name: CATALOG GREEN 367
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Validate 367-team catalog and FT/HT policy
        run: python scripts/validate_367.py

  backtest-validation:
    name: BACKTEST GREEN Dixon-Coles
    needs: catalog-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate reproducible 367-team backtest
        run: python scripts/validate_backtest_367.py
